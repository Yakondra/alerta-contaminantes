services:
  db:
    image: mariadb:10.11
    container_name: mariadb_contaminacion
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: contaminaelroot2026
      MYSQL_DATABASE: contaminantes
      MYSQL_USER: yak
      MYSQL_PASSWORD: proyectosdel26
      TZ: Europe/Madrid
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: 
      context: ./src/back
    container_name: api
    restart: always
    ports:
      - "5001:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=yak
      - DB_PASSWORD=proyectosdel26
      - DB_NAME=contaminantes
      - TZ=Europe/Madrid

  web:
    build:
      context: ./src/front
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

  historico:
    image: grafana/grafana-oss
    container_name: historico
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - db

volumes:
  db_data:
  grafana_data: